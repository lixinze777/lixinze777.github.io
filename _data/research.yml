- title: "EMemBench"
  subtitle: "Evaluating what agents remember from their own experience"
  topic: "Episodic memory"
  venue: "EMNLP 2026 · Findings"
  description: "I led the design and implementation of a benchmark generator that turns agent trajectories into balanced questions with verifiable, environment-derived answers."
  finding: "Across 15 text games and visual game environments, induction and spatial reasoning remain persistent memory bottlenecks."
  paper: "https://arxiv.org/abs/2601.16690"
  code: "https://github.com/InternLM/EMemBench"

- title: "Skill-as-Pseudocode"
  subtitle: "Making skill libraries more effective for LLM agents"
  topic: "Agent skills"
  venue: "EMNLP 2026 · Findings"
  description: "I designed a pipeline that refactors Markdown skills into typed pseudocode contracts with deterministic checks and concrete action templates."
  finding: "On ALFWorld with GPT-4o-mini across three seeds: 82/402 wins vs. 47/402 for Graph-of-Skills, with 22.8% fewer input tokens and 14.5% fewer LLM calls per game."
  paper: "https://arxiv.org/abs/2605.27955"
  code: "https://github.com/InternLM/Skill-as-Pseudocode"

- title: "Long Context vs. RAG"
  subtitle: "Understanding when to retrieve and when to use the full context"
  topic: "External knowledge"
  venue: "Preprint"
  description: "I developed a controlled evaluation of long-context processing and RAG across tasks, retrieval methods, and context budgets."
  finding: "Long context leads on many QA tasks; summarization-based retrieval can perform comparably, while RAG has advantages on dialogue-based and general questions."
  paper: "https://arxiv.org/abs/2501.01880"
  code: "https://github.com/lixinze777/LC_VS_RAG"
  tutorial: "https://sites.google.com/view/sigir25-lc-vs-rag/"
